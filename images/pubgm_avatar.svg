<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d5016"/>
      <stop offset="50%" stop-color="#4a7c2e"/>
      <stop offset="100%" stop-color="#1a3a0a"/>
    </linearGradient>
    <linearGradient id="helmet-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6e3a"/>
      <stop offset="100%" stop-color="#3a4a24"/>
    </linearGradient>
    <linearGradient id="vest-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7b4f"/>
      <stop offset="100%" stop-color="#4a5a32"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <circle cx="100" cy="100" r="100" fill="#f0c040"/>
  <circle cx="100" cy="100" r="96" fill="url(#bg-grad)"/>
  <g clip-path="url(#circle-clip)">
    <!-- 身体/防弹衣 -->
    <rect x="55" y="120" width="90" height="80" rx="20" fill="url(#vest-grad)"/>
    <rect x="70" y="125" width="60" height="50" rx="8" fill="#5a6a3e" opacity="0.6"/>
    <!-- 头部 -->
    <ellipse cx="100" cy="90" rx="32" ry="36" fill="#d4a574"/>
    <!-- 三级头 -->
    <path d="M62 82 Q100 40 138 82 Q138 70 100 55 Q62 70 62 82Z" fill="url(#helmet-grad)"/>
    <path d="M68 82 Q100 50 132 82" fill="none" stroke="#4a5a30" stroke-width="3"/>
    <!-- 面罩 -->
    <rect x="72" y="82" width="56" height="20" rx="4" fill="#2a3418" opacity="0.7"/>
    <!-- 护目镜 -->
    <ellipse cx="86" cy="85" rx="10" ry="7" fill="#1a2a10" stroke="#888" stroke-width="1.5"/>
    <ellipse cx="114" cy="85" rx="10" ry="7" fill="#1a2a10" stroke="#888" stroke-width="1.5"/>
    <ellipse cx="86" cy="84" rx="6" ry="4" fill="#aaddff" opacity="0.3"/>
    <ellipse cx="114" cy="84" rx="6" ry="4" fill="#aaddff" opacity="0.3"/>
    <rect x="96" y="83" width="8" height="4" rx="1" fill="#888"/>
    <!-- 枪 -->
    <rect x="130" y="130" width="50" height="8" rx="3" fill="#3a3a3a" transform="rotate(-30 130 130)"/>
    <rect x="125" y="135" width="12" height="20" rx="2" fill="#4a4a4a" transform="rotate(-30 130 130)"/>
  </g>
  <!-- 金色边框 -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#f0c040" stroke-width="4"/>
  <!-- 周年庆角标 -->
  <g transform="translate(145, 155)">
    <rect x="-20" y="-10" width="50" height="22" rx="11" fill="#f5222d"/>
    <text x="5" y="5" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial,sans-serif">周年庆</text>
  </g>
</svg>
